name: Wheels

on:
  push:
    branches: [Rust, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-wheels:
    name: Build ${{ matrix.platform }} wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            cibw_archs_linux: x86_64
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            cibw_archs_linux: aarch64
          - platform: macos-x86_64
            os: macos-15-intel
            cibw_archs_linux: ""
          - platform: macos-arm64
            os: macos-14
            cibw_archs_linux: ""
          - platform: windows-amd64
            os: windows-2022
            cibw_archs_linux: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.4.0

      - name: Select wheel build scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_REF" == refs/tags/* ]]; then
            echo "CIBW_BUILD=cp312-* cp313-* cp314-*" >> "$GITHUB_ENV"
          else
            echo "CIBW_BUILD=cp312-*" >> "$GITHUB_ENV"
          fi

          if [[ -n "${{ matrix.cibw_archs_linux }}" ]]; then
            echo "CIBW_ARCHS_LINUX=${{ matrix.cibw_archs_linux }}" >> "$GITHUB_ENV"
          fi

      - name: Pre-pull manylinux image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          case "$RUNNER_ARCH" in
            X64)
              image=quay.io/pypa/manylinux_2_28_x86_64:2026.03.01-1
              ;;
            ARM64)
              image=quay.io/pypa/manylinux_2_28_aarch64:2026.03.01-1
              ;;
            *)
              echo "Unsupported Linux runner architecture: $RUNNER_ARCH" >&2
              exit 1
              ;;
          esac

          for attempt in 1 2 3; do
            if docker pull "$image"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep "$((attempt * 30))"
          done

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
