[package]
name = "pystamps-web"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
askama = "0.14"
axum = { version = "0.8", features = ["form"] }
pystamps-core = { path = "../pystamps-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "process", "rt-multi-thread", "sync"] }
uuid = { version = "1.18", features = ["v4"] }
