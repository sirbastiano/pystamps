[build-system]
requires = ["setuptools>=77", "setuptools-scm[toml]>=8", "setuptools-rust>=1.10", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pystamps-insar"
dynamic = ["version"]
description = "Python-first, threaded StaMPS migration toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "pySTAMPS contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
keywords = ["insar", "stamps", "geodesy", "remote-sensing"]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "h5py>=3.11",
  "mat73>=0.65",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13.0"]
dev = [
  "build>=1.2",
  "cibuildwheel>=2.23",
  "pytest>=9.0.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "setuptools-rust>=1.10",
  "twine>=5.1",
]

[project.scripts]
pystamps = "pystamps.cli:main"
pystamps-native = "pystamps.native_cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
pystamps = ["data/*.json", "bin/*"]

[tool.setuptools.packages.find]
include = ["pystamps*"]

[tool.setuptools_scm]
write_to = "pystamps/_version.py"
fallback_version = "0.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "dataset_parity: tests that require local parity datasets under inputs_and_outputs/",
]

[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-*"
skip = "*-musllinux*"
test-command = "pystamps-native coverage --start-step 1 --end-step 8"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = [
  "if ! command -v cargo >/dev/null 2>&1; then curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path; fi",
  "cargo --version",
]
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
archs = ["auto"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
